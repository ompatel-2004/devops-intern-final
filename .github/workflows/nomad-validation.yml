name: Validate and Deploy Nomad Job

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nomad/nginx-app.nomad.hcl"
      - ".github/workflows/nomad-validation.yml"

permissions:
  contents: read
  packages: read

env:
  NOMAD_VERSION: "1.11.3"
  CONSUL_VERSION: "1.20.2"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nomad
        run: |
          curl -fsSL \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            -o /tmp/nomad.zip

          unzip -o /tmp/nomad.zip -d /tmp/nomad

          sudo install \
            -m 0755 \
            /tmp/nomad/nomad \
            /usr/local/bin/nomad

          nomad version

      - name: Install Consul
        run: |
          curl -fsSL \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip" \
            -o /tmp/consul.zip

          unzip -o /tmp/consul.zip -d /tmp/consul

          sudo install \
            -m 0755 \
            /tmp/consul/consul \
            /usr/local/bin/consul

          consul version

      - name: Start Consul
        run: |
          nohup consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in {1..60}; do
            LEADER=$(curl -fsS \
              http://127.0.0.1:8500/v1/status/leader \
              2>/dev/null || true)

            echo "Consul leader response: ${LEADER}"

            if [ -n "${LEADER}" ] && [ "${LEADER}" != "\"\"" ]; then
              echo "Consul is ready."
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: Consul did not become ready."
              cat /tmp/consul.log
              exit 1
            fi

            sleep 2
          done

          consul members

      - name: Start Nomad
        run: |
          mkdir -p /tmp/nomad

          nohup nomad agent \
            -dev \
            -bind=0.0.0.0 \
            -network-interface=lo \
            -data-dir=/tmp/nomad \
            > /tmp/nomad.log 2>&1 &

          for i in {1..60}; do
            LEADER=$(curl -fsS \
              http://127.0.0.1:4646/v1/status/leader \
              2>/dev/null || true)

            echo "Nomad leader response: ${LEADER}"

            if [ -n "${LEADER}" ] && [ "${LEADER}" != "\"\"" ]; then
              echo "Nomad server is ready."
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: Nomad server did not become ready."
              cat /tmp/nomad.log
              exit 1
            fi

            sleep 2
          done

      - name: Verify Nomad Node
        run: |
          for i in {1..60}; do
            echo "===== Nomad node check ${i}/60 ====="

            NODES_JSON=$(nomad node status -json 2>/dev/null || true)

            if [ -n "${NODES_JSON}" ]; then
              echo "${NODES_JSON}" | jq .
            fi

            READY_NODES=$(
              echo "${NODES_JSON}" |
              jq -r '
                if type == "array"
                then
                  [
                    .[] |
                    select(.Status == "ready")
                  ] |
                  length
                else
                  if .Status == "ready" then 1 else 0 end
                end
              ' 2>/dev/null || echo "0"
            )

            echo "Ready Nomad nodes: ${READY_NODES}"

            if [ "${READY_NODES}" -ge 1 ]; then
              echo "Nomad client node is ready."
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: No ready Nomad client node was registered."
              nomad node status || true
              cat /tmp/nomad.log || true
              exit 1
            fi

            sleep 2
          done

      - name: Verify Consul
        run: |
          curl -fsS \
            http://127.0.0.1:8500/v1/agent/self |
            jq .

          echo "Consul agent is healthy."

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull Published Image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          echo "Pulling image:"
          echo "${IMAGE}"

          docker pull "${IMAGE}"

          docker image inspect "${IMAGE}" \
            --format 'Image ID: {{.Id}}'

      - name: Validate Nomad Job
        run: |
          nomad job validate \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad Deployment
        run: |
          set +e

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          PLAN_EXIT_CODE=$?

          set -e

          echo "Nomad plan exit code: ${PLAN_EXIT_CODE}"

          if [ "${PLAN_EXIT_CODE}" -ne 0 ] &&
             [ "${PLAN_EXIT_CODE}" -ne 1 ]; then
            echo "ERROR: Nomad plan failed."
            exit "${PLAN_EXIT_CODE}"
          fi

          echo "Nomad plan completed successfully."

      - name: Deploy Nomad Job
        run: |
          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Verify Nomad Deployment
        run: |
          for i in {1..60}; do
            echo "===== Deployment check ${i}/60 ====="

            DEPLOYMENT_JSON=$(
              nomad job deployments \
                -json \
                -latest \
                nginx-app \
                2>/dev/null || true
            )

            if [ -n "${DEPLOYMENT_JSON}" ]; then
              echo "${DEPLOYMENT_JSON}" | jq .
            fi

            DEPLOYMENT_STATUS=$(
              echo "${DEPLOYMENT_JSON}" |
              jq -r '
                if type == "array"
                then .[0].Status
                else .Status
                end
              ' 2>/dev/null || echo ""
            )

            echo "Deployment status: ${DEPLOYMENT_STATUS}"

            if [ "${DEPLOYMENT_STATUS}" = "successful" ]; then
              echo "Nomad deployment completed successfully."
              break
            fi

            if [ "${DEPLOYMENT_STATUS}" = "failed" ]; then
              echo "ERROR: Nomad deployment failed."
              nomad job status nginx-app || true
              exit 1
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: Nomad deployment did not become successful."
              nomad job status nginx-app || true
              exit 1
            fi

            sleep 2
          done

      - name: Verify Allocation Health
        run: |
          for i in {1..60}; do
            echo "===== Allocation health check ${i}/60 ====="

            ALLOCATIONS_JSON=$(
              nomad job allocs \
                -json \
                nginx-app \
                2>/dev/null || true
            )

            if [ -z "${ALLOCATIONS_JSON}" ]; then
              echo "No allocation data available yet."
              sleep 2
              continue
            fi

            echo "${ALLOCATIONS_JSON}" | jq .

            ALLOCATION=$(
              echo "${ALLOCATIONS_JSON}" |
              jq -c '
                [
                  .[] |
                  select(
                    .DesiredStatus == "run" and
                    .ClientStatus == "running"
                  )
                ] |
                sort_by(.CreateTime) |
                last
              '
            )

            if [ -z "${ALLOCATION}" ] ||
               [ "${ALLOCATION}" = "null" ]; then
              echo "No running allocation found yet."
              sleep 2
              continue
            fi

            ALLOC_ID=$(echo "${ALLOCATION}" | jq -r '.ID')

            CLIENT_STATUS=$(echo "${ALLOCATION}" | jq -r '.ClientStatus')

            DESIRED_STATUS=$(echo "${ALLOCATION}" | jq -r '.DesiredStatus')

            HEALTHY=$(
              echo "${ALLOCATION}" |
              jq -r '.DeploymentStatus.Healthy // false'
            )

            echo "Allocation ID: ${ALLOC_ID}"
            echo "Client Status: ${CLIENT_STATUS}"
            echo "Desired Status: ${DESIRED_STATUS}"
            echo "Deployment Healthy: ${HEALTHY}"

            if [ "${CLIENT_STATUS}" = "running" ] &&
               [ "${DESIRED_STATUS}" = "run" ] &&
               [ "${HEALTHY}" = "true" ]; then
              echo "Nomad allocation is healthy."
              break
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: Nomad allocation did not become healthy."
              nomad alloc status "${ALLOC_ID}" || true
              exit 1
            fi

            sleep 2
          done

      - name: Verify Nomad HTTP Health Check
        run: |
          ALLOCATIONS_JSON=$(
            nomad job allocs \
              -json \
              nginx-app
          )

          ALLOC_ID=$(
            echo "${ALLOCATIONS_JSON}" |
            jq -r '
              [
                .[] |
                select(
                  .DesiredStatus == "run" and
                  .ClientStatus == "running"
                )
              ] |
              sort_by(.CreateTime) |
              last |
              .ID
            '
          )

          if [ -z "${ALLOC_ID}" ] ||
             [ "${ALLOC_ID}" = "null" ]; then
            echo "ERROR: No running allocation found."
            exit 1
          fi

          echo "Allocation ID: ${ALLOC_ID}"

          for i in {1..30}; do
            echo "===== Nomad HTTP check ${i}/30 ====="

            CHECKS_JSON=$(
              nomad alloc checks \
                -json \
                "${ALLOC_ID}" \
                2>/dev/null || true
            )

            if [ -n "${CHECKS_JSON}" ]; then
              echo "${CHECKS_JSON}" | jq .
            fi

            SUCCESSFUL_CHECKS=$(
              echo "${CHECKS_JSON}" |
              jq '
                if type == "array"
                then
                  [
                    .[] |
                    select(.Status == "success")
                  ] |
                  length
                else
                  0
                end
              ' 2>/dev/null || echo "0"
            )

            echo "Successful checks: ${SUCCESSFUL_CHECKS}"

            if [ "${SUCCESSFUL_CHECKS}" -ge 1 ]; then
              echo "Nomad HTTP health check is passing."
              break
            fi

            if [ "${i}" -eq 30 ]; then
              echo "ERROR: Nomad HTTP health check did not pass."
              nomad alloc checks "${ALLOC_ID}" || true
              exit 1
            fi

            sleep 2
          done

      - name: Check Consul Service
        run: |
          for i in {1..30}; do
            echo "===== Consul service check ${i}/30 ====="

            SERVICE_OUTPUT=$(
              curl -fsS \
                http://127.0.0.1:8500/v1/health/service/nginx-app \
                2>/dev/null || true
            )

            if [ -n "${SERVICE_OUTPUT}" ]; then
              echo "${SERVICE_OUTPUT}" | jq .
            fi

            PASSING=$(
              echo "${SERVICE_OUTPUT}" |
              jq '
                if type == "array" and length > 0
                then
                  all(
                    .[];
                    all(.Checks[]; .Status == "passing")
                  )
                else
                  false
                end
              ' 2>/dev/null || echo "false"
            )

            echo "Consul checks passing: ${PASSING}"

            if [ "${PASSING}" = "true" ]; then
              echo "Consul service is healthy."
              break
            fi

            if [ "${i}" -eq 30 ]; then
              echo "ERROR: Consul service health check failed."
              curl -fsS \
                http://127.0.0.1:8500/v1/health/service/nginx-app |
                jq . || true
              exit 1
            fi

            sleep 2
          done

      - name: Verify Application Through Consul
        run: |
          SERVICE_OUTPUT=$(
            curl -fsS \
              http://127.0.0.1:8500/v1/health/service/nginx-app
          )

          SERVICE_ADDRESS=$(
            echo "${SERVICE_OUTPUT}" |
            jq -r '.[0].Service.Address'
          )

          SERVICE_PORT=$(
            echo "${SERVICE_OUTPUT}" |
            jq -r '.[0].Service.Port'
          )

          if [ -z "${SERVICE_ADDRESS}" ] ||
             [ "${SERVICE_ADDRESS}" = "null" ]; then
            SERVICE_ADDRESS="127.0.0.1"
          fi

          if [ -z "${SERVICE_PORT}" ] ||
             [ "${SERVICE_PORT}" = "null" ]; then
            echo "ERROR: Consul did not return a service port."
            exit 1
          fi

          URL="http://${SERVICE_ADDRESS}:${SERVICE_PORT}/healthz"

          echo "Testing:"
          echo "${URL}"

          for i in {1..30}; do
            HTTP_STATUS=$(
              curl -s \
                -o /dev/null \
                -w "%{http_code}" \
                --max-time 5 \
                "${URL}" || true
            )

            echo "HTTP status: ${HTTP_STATUS}"

            if [ "${HTTP_STATUS}" = "200" ]; then
              echo "Application HTTP health check passed."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Application did not return HTTP 200."
          exit 1

      - name: Verify Nomad Job Status
        run: |
          JOB_JSON=$(
            nomad job status \
              -json \
              nginx-app
          )

          echo "${JOB_JSON}" | jq .

          JOB_STATUS=$(
            echo "${JOB_JSON}" |
            jq -r '.Status'
          )

          echo "Nomad job status: ${JOB_STATUS}"

          if [ "${JOB_STATUS}" != "running" ]; then
            echo "ERROR: Nomad job is not running."
            exit 1
          fi

          echo "Nomad job is running."

      - name: Final Validation Summary
        run: |
          echo "=========================================="
          echo "       NOMAD VALIDATION SUCCESSFUL"
          echo "=========================================="

          echo "Nomad:"
          nomad version

          echo ""
          echo "Job:"
          nomad job status nginx-app

          echo ""
          echo "Allocations:"
          nomad job allocs nginx-app

          echo ""
          echo "Consul:"
          curl -fsS \
            http://127.0.0.1:8500/v1/health/service/nginx-app |
            jq .

          echo ""
          echo "Image:"
          echo "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          echo ""
          echo "All validation checks passed."

      - name: Show Nomad Logs
        if: always()
        run: |
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

      - name: Show Consul Logs
        if: always()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

      - name: Cleanup
        if: always()
        run: |
          nomad job stop -purge nginx-app || true
