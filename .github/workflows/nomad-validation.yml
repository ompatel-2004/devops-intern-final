name: Nomad Validation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Image Tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Using image tag: ${HEAD_SHA}"
          echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install Consul
        env:
          CONSUL_VERSION: "1.20.3"
        run: |
          curl -fsSLo /tmp/consul.zip \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/consul-bin

          unzip -o /tmp/consul.zip \
            -d /tmp/consul-bin

          sudo install \
            /tmp/consul-bin/consul \
            /usr/local/bin/consul

          consul version

      - name: Install Nomad
        env:
          NOMAD_VERSION: "1.9.7"
        run: |
          curl -fsSLo /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/nomad-bin

          unzip -o /tmp/nomad.zip \
            -d /tmp/nomad-bin

          sudo install \
            /tmp/nomad-bin/nomad \
            /usr/local/bin/nomad

          nomad version

      - name: Start Consul
        run: |
          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          sleep 5

          echo "===== CONSUL MEMBERS ====="
          consul members

      - name: Start Nomad
        run: |
          nomad agent \
            -dev \
            > /tmp/nomad.log 2>&1 &

          sleep 10

          echo "===== NOMAD NODES ====="
          nomad node status

      - name: Validate Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Verify Published Image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== VERIFYING GHCR IMAGE ====="
          echo "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          docker pull \
            "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

      - name: Plan Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== NOMAD PLAN ====="

          set +e

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            -no-color \
            nomad/nginx-app.nomad.hcl \
            2>&1 | tee /tmp/nomad-plan.txt

          PLAN_EXIT=${PIPESTATUS[0]}

          set -e

          echo "Nomad plan exit code: ${PLAN_EXIT}"

          if [ "${PLAN_EXIT}" -eq 0 ]; then
            echo "Nomad plan completed successfully with no allocation changes."
            exit 0
          fi

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "Nomad plan completed successfully and reports allocation changes."
            echo "Exit code 1 is expected when the plan creates or destroys allocations."
            exit 0
          fi

          echo "ERROR: Nomad plan failed."
          exit "${PLAN_EXIT}"

      - name: Run Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== DEPLOYING NOMAD JOB ====="

          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Wait for Healthy Allocation
        run: |
          echo "===== WAITING FOR HEALTHY ALLOCATION ====="

          for i in {1..30}; do
            echo ""
            echo "===== Attempt ${i}/30 ====="

            nomad job status nginx-app || true

            ALLOC_ID=$(
              nomad job allocs nginx-app -json 2>/dev/null |
              jq -r '
                .[]
                | select(.ClientStatus == "running")
                | .ID
              ' |
              head -n 1
            )

            if [ -n "${ALLOC_ID}" ]; then
              echo "Running allocation: ${ALLOC_ID}"

              STATUS=$(nomad alloc status "${ALLOC_ID}" -json)

              CLIENT_STATUS=$(echo "${STATUS}" | jq -r '.ClientStatus')

              HEALTHY=$(
                echo "${STATUS}" |
                jq -r '
                  [
                    .TaskStates[].Events[]?.DisplayMessage
                  ]
                  | map(select(test("healthy"; "i")))
                  | length
                '
              )

              echo "Client status: ${CLIENT_STATUS}"
              echo "Healthy events: ${HEALTHY}"

              if [ "${CLIENT_STATUS}" = "running" ] &&
                 [ "${HEALTHY}" -gt 0 ]; then

                echo "Nomad allocation is running and healthy."
                exit 0
              fi
            fi

            sleep 5
          done

          echo "ERROR: Nomad allocation did not become healthy."
          exit 1

      - name: Check Consul Service
        run: |
          echo "===== CONSUL SERVICE HEALTH ====="

          consul health service nginx-app

      - name: Verify Nomad Job Status
        run: |
          echo "===== FINAL NOMAD JOB STATUS ====="

          nomad job status nginx-app

      - name: Verify Nomad Node Status
        run: |
          echo "===== FINAL NOMAD NODE STATUS ====="

          nomad node status

      - name: Show Agent Logs
        if: always()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo ""
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

      - name: Show Final Nomad Allocation Status
        if: always()
        run: |
          echo "===== NOMAD ALLOCATIONS ====="

          nomad job allocs nginx-app || true
