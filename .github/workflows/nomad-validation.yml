name: Nomad Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate-nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    env:
      NOMAD_VERSION: "1.7.7"
      CONSUL_VERSION: "1.17.2"
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: ghcr.io/ompatel-2004/devops-intern-final

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned HashiCorp tools
        env:
          NOMAD_VERSION: "1.7.7"
          CONSUL_VERSION: "1.17.2"
        run: |
          set -euo pipefail

          ARCH="amd64"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl -fsSL \
            -o "$TMP_DIR/nomad.zip" \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/nomad"
          unzip -q "$TMP_DIR/nomad.zip" -d "$TMP_DIR/nomad"
          sudo install -m 0755 "$TMP_DIR/nomad/nomad" /usr/local/bin/nomad

          curl -fsSL \
            -o "$TMP_DIR/consul.zip" \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/consul"
          unzip -q "$TMP_DIR/consul.zip" -d "$TMP_DIR/consul"
          sudo install -m 0755 "$TMP_DIR/consul/consul" /usr/local/bin/consul

          nomad version
          consul version
          jq --version

      - name: Start Consul agent
        run: |
          set -euo pipefail

          nohup consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in $(seq 1 30); do
            if consul members >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          consul members

      - name: Start Nomad agent
        run: |
          set -euo pipefail

          nohup nomad agent \
            -dev \
            -bind=127.0.0.1 \
            -consul-address=127.0.0.1:8500 \
            > /tmp/nomad.log 2>&1 &

          for i in $(seq 1 30); do
            if nomad node status >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          nomad node status

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Pull immutable application image
        run: |
          set -euo pipefail

          for i in $(seq 1 10); do
            if docker pull "${IMAGE_NAME}:${IMAGE_TAG}"; then
              break
            fi

            if [ "$i" -eq 10 ]; then
              echo "Failed to pull ${IMAGE_NAME}:${IMAGE_TAG}"
              exit 1
            fi

            sleep 10
          done

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Image: {{.RepoTags}}'
          
          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Validate Nomad job
        run: |
          set -euo pipefail

          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad job
        run: |
          set -euo pipefail

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Run Nomad job
        run: |
          set -euo pipefail

          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Wait for healthy allocation
        run: |
          set -euo pipefail

          JOB_ID="nginx-app"

          for i in $(seq 1 60); do
            ALLOC_ID="$(nomad job allocs -json "$JOB_ID" | jq -r '
              map(select(.ClientStatus == "running"))
              | sort_by(.CreateTime)
              | last
              | .ID // empty
            ')"

            if [ -n "$ALLOC_ID" ]; then
              HEALTHY="$(nomad alloc status -json "$ALLOC_ID" | jq -r '
                [
                  .TaskStates[]?.Services[]?.Checks[]?
                  | select(.Name == "http")
                  | .Status
                ]
                | any(. == "passing")
              ')"

              if [ "$HEALTHY" = "true" ]; then
                echo "Healthy allocation: $ALLOC_ID"
                echo "HTTP health check is passing."
                break
              fi
            fi

            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for a healthy allocation."
              nomad job status "$JOB_ID"
              exit 1
            fi

            sleep 2
          done

      - name: Show Nomad job status
        run: |
          set -euo pipefail

          nomad job status nginx-app

      - name: Verify allocation details
        run: |
          set -euo pipefail

          ALLOC_ID="$(nomad job allocs -json nginx-app | jq -r '
            map(select(.ClientStatus == "running"))
            | sort_by(.CreateTime)
            | last
            | .ID
          ')"

          test -n "$ALLOC_ID"

          nomad alloc status "$ALLOC_ID"

          nomad alloc status -json "$ALLOC_ID" | jq '{
            id: .ID,
            status: .ClientStatus,
            desired_status: .DesiredStatus,
            task_states: .TaskStates
          }'

      - name: Verify Consul service registration
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if consul catalog service nginx-app >/dev/null 2>&1; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "nginx-app service was not registered in Consul."
              consul catalog services
              exit 1
            fi

            sleep 2
          done

          consul catalog service nginx-app

          HEALTH_JSON="$(consul health service nginx-app -passing -format=json)"

          echo "$HEALTH_JSON" | jq .

          COUNT="$(echo "$HEALTH_JSON" | jq 'length')"

          if [ "$COUNT" -lt 1 ]; then
            echo "No passing Consul health checks found."
            exit 1
          fi

      - name: Verify dynamic HTTP port
        run: |
          set -euo pipefail

          ALLOC_ID="$(nomad job allocs -json nginx-app | jq -r '
            map(select(.ClientStatus == "running"))
            | sort_by(.CreateTime)
            | last
            | .ID
          ')"

          PORT="$(nomad alloc status -json "$ALLOC_ID" | jq -r '
            .Resources.Networks[0].DynamicPorts[]
            | select(.Label == "http")
            | .Value
          ')"

          if [ -z "$PORT" ] || [ "$PORT" = "null" ]; then
            echo "Dynamic HTTP port was not found."
            exit 1
          fi

          echo "Dynamic HTTP port: $PORT"

          HTTP_CODE="$(curl -sS -o /tmp/healthz-response.txt -w '%{http_code}' \
            "http://127.0.0.1:${PORT}/healthz")"

          echo "HTTP status: $HTTP_CODE"
          echo "Response:"
          cat /tmp/healthz-response.txt

          test "$HTTP_CODE" = "200"

      - name: Show agent logs on failure
        if: ${{ failure() }}
        run: |
          echo "=== Consul Logs ==="
          cat /tmp/consul.log || true
          echo
          echo "=== Nomad Logs ==="
          cat /tmp/nomad.log || true
          echo
          echo "=== Docker Containers ==="
          docker ps -a || true
          echo
          echo "=== Nomad Jobs ==="
          nomad job status || true
          echo
          echo "=== Consul Services ==="
          consul catalog services || true
