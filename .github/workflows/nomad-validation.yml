name: Nomad Validation

on:
  push:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned HashiCorp tools
        env:
          NOMAD_VERSION: "1.7.7"
          CONSUL_VERSION: "1.17.2"
        run: |
          set -euo pipefail

          curl -fsSLo nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"

          curl -fsSLo consul.zip \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"

          sudo apt-get update
          sudo apt-get install -y unzip jq

          unzip -o nomad.zip
          unzip -o consul.zip

          sudo install -m 0755 nomad /usr/local/bin/nomad
          sudo install -m 0755 consul /usr/local/bin/consul

          nomad version
          consul version

      - name: Start Consul agent
        run: |
          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8500/v1/status/leader | grep -q '"'; then
              echo "Consul is ready."
              break
            fi

            echo "Waiting for Consul... (${i}/30)"
            sleep 2
          done

          consul members

      - name: Start Nomad agent
        run: |
          sudo nomad agent \
            -dev \
            -bind=0.0.0.0 \
            -network-interface=lo \
            > /tmp/nomad.log 2>&1 &

          for i in {1..30}; do
            if nomad node status >/dev/null 2>&1; then
              echo "Nomad is ready."
              break
            fi

            echo "Waiting for Nomad... (${i}/30)"
            sleep 2
          done

          nomad node status

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull immutable application image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker pull \
            "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

      - name: Validate Nomad job
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad job
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Run Nomad job
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Wait for healthy allocation
        run: |
          set -euo pipefail

          for i in {1..60}; do
            echo "===== Nomad status attempt ${i}/60 ====="

            nomad job status nginx-app || true

            ALLOC_ID="$(
              nomad job allocs -json nginx-app 2>/dev/null \
                | jq -r '
                    [.[] | select(.ClientStatus == "running")]
                    | .[0].ID // empty
                  '
            )"

            if [ -n "${ALLOC_ID}" ]; then
              echo "Running allocation found: ${ALLOC_ID}"

              if nomad alloc status "${ALLOC_ID}" \
                | grep -q "healthy"; then
                echo "Healthy allocation confirmed."
                break
              fi
            fi

            if [ "${i}" -eq 60 ]; then
              echo "ERROR: No healthy Nomad allocation was found."
              nomad job status nginx-app
              exit 1
            fi

            sleep 2
          done

      - name: Show Nomad job status
        run: |
          nomad job status nginx-app

      - name: Verify allocation details
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  [.[] | select(.ClientStatus == "running")]
                  | .[0].ID
                '
          )"

          if [ -z "${ALLOC_ID}" ] || [ "${ALLOC_ID}" = "null" ]; then
            echo "ERROR: Running allocation not found."
            exit 1
          fi

          echo "Nomad Allocation ID: ${ALLOC_ID}"
          nomad alloc status "${ALLOC_ID}"

      - name: Verify Consul service registration
        run: |
          set -euo pipefail

          echo "Registered services:"
          curl -fsS \
            http://127.0.0.1:8500/v1/catalog/services \
            | jq .

          echo
          echo "nginx-app service health:"
          curl -fsS \
            http://127.0.0.1:8500/v1/health/service/nginx-app \
            | jq .

          HEALTH_STATUS="$(
            curl -fsS \
              http://127.0.0.1:8500/v1/health/service/nginx-app \
              | jq -r '.[0].Checks[] | select(.CheckID | contains("nginx-health")) | .Status'
          )"

          echo "Consul health status: ${HEALTH_STATUS}"

          if [ "${HEALTH_STATUS}" != "passing" ]; then
            echo "ERROR: nginx-app Consul health check is not passing."
            exit 1
          fi

      - name: Verify dynamic HTTP port
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  [.[] | select(.ClientStatus == "running")]
                  | .[0].ID
                '
          )"

          HOST_PORT="$(
            nomad alloc status -json "${ALLOC_ID}" \
              | jq -r '
                  .AllocatedResources.Shared.Networks[0].DynamicPorts[]
                  | select(.Label == "http")
                  | .Value
                '
          )"

          if [ -z "${HOST_PORT}" ] || [ "${HOST_PORT}" = "null" ]; then
            echo "ERROR: Nomad dynamic HTTP port was not found."
            exit 1
          fi

          echo "Dynamic HTTP host port: ${HOST_PORT}"

          timeout 60s sh -c \
            "until curl -fsS http://127.0.0.1:${HOST_PORT}/healthz >/dev/null; do sleep 2; done"

          echo "Application health check through Nomad dynamic port:"
          curl -i \
            "http://127.0.0.1:${HOST_PORT}/healthz"

          chmod +x scripts/healthcheck.sh

          ./scripts/healthcheck.sh \
            "http://127.0.0.1:${HOST_PORT}/healthz"

      - name: Show agent logs on failure
        if: failure()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true
