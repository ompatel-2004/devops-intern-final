name: Nomad Validation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Image Tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "Using image tag: ${HEAD_SHA}"
          echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install Consul
        env:
          CONSUL_VERSION: "1.20.3"
        run: |
          set -euo pipefail

          curl -fsSLo /tmp/consul.zip \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/consul-bin

          unzip -o /tmp/consul.zip \
            -d /tmp/consul-bin

          sudo install \
            /tmp/consul-bin/consul \
            /usr/local/bin/consul

          consul version

      - name: Install Nomad
        env:
          NOMAD_VERSION: "1.9.7"
        run: |
          set -euo pipefail

          curl -fsSLo /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/nomad-bin

          unzip -o /tmp/nomad.zip \
            -d /tmp/nomad-bin

          sudo install \
            /tmp/nomad-bin/nomad \
            /usr/local/bin/nomad

          nomad version

      - name: Start Consul
        run: |
          set -euo pipefail

          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          sleep 5

          echo "===== CONSUL VERSION ====="
          consul version

          echo ""
          echo "===== CONSUL MEMBERS ====="
          consul members

      - name: Start Nomad
        run: |
          set -euo pipefail

          nomad agent \
            -dev \
            > /tmp/nomad.log 2>&1 &

          sleep 10

          echo "===== NOMAD VERSION ====="
          nomad version

          echo ""
          echo "===== NOMAD NODES ====="
          nomad node status

      - name: Validate Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          echo "===== VALIDATING NOMAD JOB ====="

          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          echo ""
          echo "Nomad job validation passed."

      - name: Log in to GHCR
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Verify Published Image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          echo "===== VERIFYING GHCR IMAGE ====="
          echo "${IMAGE}"

          docker pull "${IMAGE}"

          echo ""
          echo "GHCR image pull succeeded."

      - name: Plan Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          echo "===== NOMAD PLAN ====="

          set +e

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            -no-color \
            nomad/nginx-app.nomad.hcl \
            2>&1 | tee /tmp/nomad-plan.txt

          PLAN_EXIT=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Nomad plan exit code: ${PLAN_EXIT}"

          case "${PLAN_EXIT}" in
            0)
              echo "Plan completed successfully: no allocation changes."
              ;;
            1)
              echo "Plan completed successfully: allocation changes detected."
              ;;
            255)
              echo "ERROR: Nomad plan failed."
              exit 255
              ;;
            *)
              echo "ERROR: Unexpected Nomad plan exit code: ${PLAN_EXIT}"
              exit "${PLAN_EXIT}"
              ;;
          esac

      - name: Run Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail

          echo "===== DEPLOYING NOMAD JOB ====="

          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          echo ""
          echo "Nomad deployment completed successfully."

      - name: Verify Deployment Health
        run: |
          set -euo pipefail

          echo "===== LATEST NOMAD DEPLOYMENT ====="

          DEPLOYMENT_JSON=$(
            nomad job deployments \
              -json \
              -latest \
              nginx-app
          )

          echo "${DEPLOYMENT_JSON}" | jq .

          DEPLOYMENT_STATUS=$(
            echo "${DEPLOYMENT_JSON}" |
            jq -r '
              if type == "array"
              then .[0].Status
              else .Status
              end
            '
          )

          DEPLOYMENT_DESCRIPTION=$(
            echo "${DEPLOYMENT_JSON}" |
            jq -r '
              if type == "array"
              then .[0].StatusDescription
              else .StatusDescription
              end
            '
          )

          echo ""
          echo "Deployment Status: ${DEPLOYMENT_STATUS}"
          echo "Deployment Description: ${DEPLOYMENT_DESCRIPTION}"

          if [ "${DEPLOYMENT_STATUS}" != "successful" ]; then
            echo ""
            echo "ERROR: Latest Nomad deployment is not successful."
            exit 1
          fi

          echo ""
          echo "Deployment status: successful."

      - name: Find Running Allocation
        id: allocation
        shell: bash
        run: |
          set -euo pipefail

          echo "===== NOMAD ALLOCATIONS ====="

          nomad job allocs \
            -no-color \
            nginx-app

          echo ""
          echo "===== FINDING RUNNING ALLOCATION ====="

          ALLOC_ID=$(
            nomad job allocs \
              -t '{{ range . }}{{ if and (eq .ClientStatus "running") (eq .DesiredStatus "run") }}{{ println .ID }}{{ end }}{{ end }}' \
              nginx-app |
            head -n 1
          )

          if [ -z "${ALLOC_ID}" ]; then
            echo "ERROR: No running Nomad allocation found."
            exit 1
          fi

          echo "Running allocation: ${ALLOC_ID}"

          echo "allocation_id=${ALLOC_ID}" >> "$GITHUB_OUTPUT"

      - name: Verify Allocation Health
        env:
          ALLOC_ID: ${{ steps.allocation.outputs.allocation_id }}
        run: |
          set -euo pipefail

          echo "===== NOMAD ALLOCATION STATUS ====="

          nomad alloc status \
            "${ALLOC_ID}"

          echo ""
          echo "===== VERIFYING ALLOCATION HEALTH ====="

          ALLOC_STATUS=$(
            nomad alloc status \
              -short \
              "${ALLOC_ID}"
          )

          echo "${ALLOC_STATUS}"

          if ! echo "${ALLOC_STATUS}" | grep -qE 'Deployment Health[[:space:]]*=[[:space:]]*healthy'; then
            echo ""
            echo "ERROR: Nomad allocation is not healthy."
            exit 1
          fi

          echo ""
          echo "Nomad allocation health: healthy."

      - name: Verify Nomad HTTP Health Check
        env:
          ALLOC_ID: ${{ steps.allocation.outputs.allocation_id }}
        run: |
          set -euo pipefail

          echo "===== NOMAD SERVICE CHECKS ====="

          nomad alloc checks \
            "${ALLOC_ID}"

          echo ""
          echo "===== VERIFYING ALIVE CHECK ====="

          CHECK_RESULT=$(
            nomad alloc checks \
              -t '{{ range . }}{{ if eq .Check "alive" }}{{ .Status }} {{ .StatusCode }}{{ end }}{{ end }}' \
              "${ALLOC_ID}"
          )

          echo "alive check result: ${CHECK_RESULT}"

          if [ "${CHECK_RESULT}" != "success 200" ]; then
            echo ""
            echo "ERROR: Nomad 'alive' check did not return success 200."
            exit 1
          fi

          echo ""
          echo "Nomad HTTP health check: success (HTTP 200)."

      - name: Check Consul Service
        run: |
          set -euo pipefail

          echo "===== CONSUL SERVICE HEALTH ====="

          consul health service \
            nginx-app

          echo ""
          echo "Consul service health check passed."

      - name: Verify Nomad Job Status
        run: |
          set -euo pipefail

          echo "===== FINAL NOMAD JOB STATUS ====="

          nomad job status \
            -no-color \
            nginx-app

      - name: Verify Nomad Node Status
        run: |
          set -euo pipefail

          echo "===== FINAL NOMAD NODE STATUS ====="

          nomad node status

      - name: Show Agent Logs
        if: always()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo ""
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

      - name: Show Final Nomad Allocation Status
        if: always()
        env:
          ALLOC_ID: ${{ steps.allocation.outputs.allocation_id }}
        run: |
          echo "===== FINAL NOMAD ALLOCATION ====="

          if [ -n "${ALLOC_ID:-}" ]; then
            nomad alloc status "${ALLOC_ID}" || true

            echo ""
            echo "===== FINAL NOMAD CHECKS ====="

            nomad alloc checks "${ALLOC_ID}" || true
          else
            nomad job allocs nginx-app || true
          fi
