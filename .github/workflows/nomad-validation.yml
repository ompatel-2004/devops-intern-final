name: Validate and Deploy Nomad Job

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "nomad/nginx-app.nomad.hcl"
      - ".github/workflows/nomad-validation.yml"

permissions:
  contents: read
  packages: read

env:
  NOMAD_VERSION: "1.11.3"
  CONSUL_VERSION: "1.20.2"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Nomad
        run: |
          curl -fsSL \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
            -o /tmp/nomad.zip

          unzip -o /tmp/nomad.zip -d /tmp/nomad

          sudo install \
            -m 0755 \
            /tmp/nomad/nomad \
            /usr/local/bin/nomad

          nomad version

      - name: Install Consul
        run: |
          curl -fsSL \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip" \
            -o /tmp/consul.zip

          unzip -o /tmp/consul.zip -d /tmp/consul

          sudo install \
            -m 0755 \
            /tmp/consul/consul \
            /usr/local/bin/consul

          consul version

      - name: Start Consul
        run: |
          nohup consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:8500/v1/status/leader |
              grep -q '"'; then
              echo "Consul is ready."
              break
            fi

            if [ "${i}" -eq 30 ]; then
              echo "ERROR: Consul did not become ready."
              cat /tmp/consul.log
              exit 1
            fi

            sleep 2
          done

          consul members

      - name: Start Nomad
        run: |
          mkdir -p /tmp/nomad

          nohup nomad agent \
            -dev \
            -bind=0.0.0.0 \
            -network-interface=lo \
            -data-dir=/tmp/nomad \
            > /tmp/nomad.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS \
              http://127.0.0.1:4646/v1/status/leader |
              grep -q '"'; then
              echo "Nomad is ready."
              break
            fi

            if [ "${i}" -eq 30 ]; then
              echo "ERROR: Nomad did not become ready."
              cat /tmp/nomad.log
              exit 1
            fi

            sleep 2
          done

          nomad node status

      - name: Verify Nomad Node
        run: |
          NODE_STATUS=$(nomad node status -self -json)

          echo "${NODE_STATUS}" | jq .

          NODE_STATE=$(echo "${NODE_STATUS}" | jq -r '.Status')

          if [ "${NODE_STATE}" != "ready" ]; then
            echo "ERROR: Nomad node is not ready."
            exit 1
          fi

          echo "Nomad node is ready."

      - name: Verify Consul
        run: |
          curl -fsS \
            http://127.0.0.1:8500/v1/agent/self |
            jq .

          echo "Consul agent is healthy."

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull Published Image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          echo "Pulling image:"
          echo "${IMAGE}"

          docker pull "${IMAGE}"

          docker image inspect "${IMAGE}" \
            --format 'Image ID: {{.Id}}'

      - name: Validate Nomad Job
        run: |
          nomad job validate \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad Deployment
        run: |
          set +e

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          PLAN_EXIT_CODE=$?

          set -e

          echo "Nomad plan exit code: ${PLAN_EXIT_CODE}"

          if [ "${PLAN_EXIT_CODE}" -ne 0 ] &&
             [ "${PLAN_EXIT_CODE}" -ne 1 ]; then
            echo "ERROR: Nomad plan failed."
            exit "${PLAN_EXIT_CODE}"
          fi

          echo "Nomad plan completed successfully."

      - name: Deploy Nomad Job
        run: |
          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Verify Nomad Deployment
        run: |
          for i in {1..60}; do
            echo "===== Deployment status ${i}/60 ====="

            DEPLOYMENT_JSON=$(
              nomad job deployments \
                -json \
                -latest \
                nginx-app \
                2>/dev/null || true
            )

            if [ -n "${DEPLOYMENT_JSON}" ]; then
              echo "${DEPLOYMENT_JSON}" | jq .
            fi

            if [ -n "${DEPLOYMENT_JSON}" ]; then
              DEPLOYMENT_STATUS=$(
                echo "${DEPLOYMENT_JSON}" |
                jq -r '
                  if type == "array"
                  then .[0].Status
                  else .Status
                  end
                '
              )

              echo "Deployment status: ${DEPLOYMENT_STATUS}"

              if [ "${DEPLOYMENT_STATUS}" = "successful" ]; then
                echo "Nomad deployment completed successfully."
                exit 0
              fi

              if [ "${DEPLOYMENT_STATUS}" = "failed" ]; then
                echo "ERROR: Nomad deployment failed."
                nomad job status nginx-app || true
                exit 1
              fi
            fi

            sleep 2
          done

          echo "ERROR: Nomad deployment did not become successful."
          nomad job status nginx-app || true
          exit 1

      - name: Verify Allocation Health
        run: |
          for i in {1..60}; do
            echo "===== Allocation health ${i}/60 ====="

            ALLOC_ID=$(
              nomad job allocs -json nginx-app |
              jq -r '
                [
                  .[] |
                  select(
                    .DesiredStatus == "run" and
                    .ClientStatus == "running"
                  )
                ] |
                sort_by(.CreateTime) |
                last |
                .ID
              '
            )

            if [ -z "${ALLOC_ID}" ] ||
               [ "${ALLOC_ID}" = "null" ]; then
              echo "No running allocation found yet."
              sleep 2
              continue
            fi

            echo "Allocation ID: ${ALLOC_ID}"

            ALLOC_STATUS=$(nomad alloc status -short "${ALLOC_ID}")

            echo "${ALLOC_STATUS}"

            CLIENT_STATUS=$(
              echo "${ALLOC_STATUS}" |
              awk -F '=' '
                /Client Status/ {
                  value=$2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  exit
                }
              '
            )

            DESIRED_STATUS=$(
              echo "${ALLOC_STATUS}" |
              awk -F '=' '
                /Desired Status/ {
                  value=$2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  exit
                }
              '
            )

            DEPLOYMENT_HEALTH=$(
              echo "${ALLOC_STATUS}" |
              awk -F '=' '
                /Deployment Health/ {
                  value=$2
                  gsub(/^[ \t]+|[ \t]+$/, "", value)
                  print value
                  exit
                }
              '
            )

            echo "Client Status: ${CLIENT_STATUS}"
            echo "Desired Status: ${DESIRED_STATUS}"
            echo "Deployment Health: ${DEPLOYMENT_HEALTH}"

            if [ "${CLIENT_STATUS}" = "running" ] &&
               [ "${DESIRED_STATUS}" = "run" ] &&
               [ "${DEPLOYMENT_HEALTH}" = "healthy" ]; then
              echo "Nomad allocation is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Nomad allocation did not become healthy."
          exit 1

      - name: Verify Nomad HTTP Health Check
        run: |
          ALLOC_ID=$(
            nomad job allocs -json nginx-app |
            jq -r '
              [
                .[] |
                select(
                  .DesiredStatus == "run" and
                  .ClientStatus == "running"
                )
              ] |
              sort_by(.CreateTime) |
              last |
              .ID
            '
          )

          if [ -z "${ALLOC_ID}" ] ||
             [ "${ALLOC_ID}" = "null" ]; then
            echo "ERROR: No running allocation found."
            exit 1
          fi

          echo "Allocation ID: ${ALLOC_ID}"

          for i in {1..30}; do
            echo "===== HTTP health check ${i}/30 ====="

            CHECK_OUTPUT=$(
              nomad alloc checks \
                "${ALLOC_ID}" \
                2>/dev/null || true
            )

            echo "${CHECK_OUTPUT}"

            if echo "${CHECK_OUTPUT}" |
              grep -Eq 'Status[[:space:]]*=[[:space:]]*success'; then
              echo "Nomad HTTP health check is passing."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Nomad HTTP health check did not pass."
          nomad alloc checks "${ALLOC_ID}" || true
          exit 1

      - name: Check Consul Service
        run: |
          for i in {1..30}; do
            SERVICE_OUTPUT=$(
              curl -fsS \
                http://127.0.0.1:8500/v1/health/service/nginx-app \
                2>/dev/null || true
            )

            echo "${SERVICE_OUTPUT}" | jq . || true

            if echo "${SERVICE_OUTPUT}" |
              jq -e '
                length > 0 and
                all(
                  .[];
                  .Checks |
                  all(.Status == "passing")
                )
              ' >/dev/null 2>&1; then
              echo "Consul service is healthy."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Consul service health check failed."

          curl -fsS \
            http://127.0.0.1:8500/v1/health/service/nginx-app |
            jq . || true

          exit 1

      - name: Verify Nomad Job Status
        run: |
          nomad job status nginx-app

          JOB_STATUS=$(
            nomad job status -json nginx-app |
            jq -r '.Status'
          )

          echo "Nomad job status: ${JOB_STATUS}"

          if [ "${JOB_STATUS}" != "running" ]; then
            echo "ERROR: Nomad job is not running."
            exit 1
          fi

          echo "Nomad job is running."

      - name: Verify Nomad Node Status
        run: |
          nomad node status

          NODE_STATUS=$(
            nomad node status -self -json |
            jq -r '.Status'
          )

          echo "Nomad node status: ${NODE_STATUS}"

          if [ "${NODE_STATUS}" != "ready" ]; then
            echo "ERROR: Nomad node is not ready."
            exit 1
          fi

          echo "Nomad node is ready."

      - name: Verify Deployment Summary
        run: |
          echo "===== NOMAD JOB STATUS ====="
          nomad job status nginx-app

          echo "===== NOMAD ALLOCATIONS ====="
          nomad job allocs nginx-app

          echo "===== CONSUL SERVICE ====="
          curl -fsS \
            http://127.0.0.1:8500/v1/health/service/nginx-app |
            jq .

      - name: Show Nomad Logs
        if: always()
        run: |
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

      - name: Show Consul Logs
        if: always()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

      - name: Cleanup
        if: always()
        run: |
          nomad job stop -purge nginx-app || true
