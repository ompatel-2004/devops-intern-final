name: Nomad Validation

on:
  push:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    env:
      NOMAD_VERSION: "1.7.7"
      CONSUL_VERSION: "1.17.2"
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned HashiCorp tools
        run: |
          set -euo pipefail

          ARCH="amd64"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          sudo apt-get update
          sudo apt-get install -y unzip jq

          curl -fsSL \
            -o "$TMP_DIR/nomad.zip" \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/nomad"
          unzip -q "$TMP_DIR/nomad.zip" -d "$TMP_DIR/nomad"

          sudo install -m 0755 \
            "$TMP_DIR/nomad/nomad" \
            /usr/local/bin/nomad

          curl -fsSL \
            -o "$TMP_DIR/consul.zip" \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/consul"
          unzip -q "$TMP_DIR/consul.zip" -d "$TMP_DIR/consul"

          sudo install -m 0755 \
            "$TMP_DIR/consul/consul" \
            /usr/local/bin/consul

          nomad version
          consul version
          jq --version

      - name: Verify Docker daemon
        run: |
          set -euo pipefail

          sudo systemctl start docker
          sudo systemctl is-active --quiet docker

          test -S /var/run/docker.sock

          docker version
          docker info

      - name: Start Consul agent
        run: |
          set -euo pipefail

          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8500/v1/status/leader \
              | grep -q '"'; then
              echo "Consul is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Consul failed to start."
              cat /tmp/consul.log
              exit 1
            fi

            sleep 2
          done

          consul members

      - name: Start Nomad agent
        run: |
          set -euo pipefail

          sudo -E env DOCKER_HOST=unix:///var/run/docker.sock \
            nomad agent \
            -dev \
            -bind=0.0.0.0 \
            -network-interface=lo \
            > /tmp/nomad.log 2>&1 &

          for i in $(seq 1 30); do
            if nomad node status >/dev/null 2>&1; then
              echo "Nomad is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Nomad failed to start."
              cat /tmp/nomad.log
              exit 1
            fi

            sleep 2
          done

          nomad node status

      - name: Verify Nomad Docker driver
        run: |
          set -euo pipefail

          NODE_ID="$(
            nomad node status -self -json \
              | jq -r '.ID'
          )"

          if [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ]; then
            echo "Nomad node ID was not found."
            nomad node status
            exit 1
          fi

          echo "Nomad node ID: ${NODE_ID}"

          nomad node status -self -verbose

          DOCKER_DETECTED="$(
            nomad node status -self -json \
              | jq -r '.Drivers.docker.Detected // false'
          )"

          DOCKER_HEALTHY="$(
            nomad node status -self -json \
              | jq -r '.Drivers.docker.Healthy // false'
          )"

          echo "Docker driver detected: ${DOCKER_DETECTED}"
          echo "Docker driver healthy: ${DOCKER_HEALTHY}"

          if [ "$DOCKER_DETECTED" != "true" ]; then
            echo "ERROR: Nomad Docker driver is not detected."
            ls -l /var/run/docker.sock || true
            docker info || true
            cat /tmp/nomad.log || true
            exit 1
          fi

          if [ "$DOCKER_HEALTHY" != "true" ]; then
            echo "ERROR: Nomad Docker driver is detected but not healthy."
            docker info || true
            cat /tmp/nomad.log || true
            exit 1
          fi

          echo "Nomad Docker driver is detected and healthy."

      - name: Validate Nomad job
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="latest"
          fi

          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad job
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            IMAGE_TAG="latest"
          fi

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Wait for immutable application image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          echo "Waiting for image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

          for i in $(seq 1 60); do
            echo "Image availability check ${i}/60"

            if docker manifest inspect \
              "${IMAGE_NAME}:${IMAGE_TAG}" \
              >/dev/null 2>&1; then

              echo "Image is available in GHCR."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "ERROR: Image was not published to GHCR."
              echo "Expected image:"
              echo "${IMAGE_NAME}:${IMAGE_TAG}"
              exit 1
            fi

            sleep 10
          done

      - name: Pull immutable application image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Image: {{.RepoTags}}'

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Digest: {{index .RepoDigests 0}}'

      - name: Run Nomad job
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Wait for healthy allocation
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            echo "===== Nomad status attempt ${i}/60 ====="

            ALLOC_ID="$(
              nomad job allocs -json nginx-app 2>/dev/null \
                | jq -r '
                    map(select(.ClientStatus == "running"))
                    | sort_by(.CreateTime)
                    | last
                    | .ID // empty
                  '
            )"

            if [ -n "$ALLOC_ID" ]; then
              echo "Running allocation: $ALLOC_ID"

              HEALTHY="$(
                nomad alloc status -json "$ALLOC_ID" \
                  | jq -r '
                      [
                        .TaskStates[]?.Services[]?.Checks[]?
                        | select(.Name == "nginx-health")
                        | .Status
                      ]
                      | any(. == "passing")
                    '
              )"

              echo "Nomad health check passing: ${HEALTHY}"

              if [ "$HEALTHY" = "true" ]; then
                echo "Healthy allocation confirmed."
                break
              fi
            fi

            if [ "$i" -eq 60 ]; then
              echo "ERROR: No healthy Nomad allocation was found."
              nomad job status nginx-app
              exit 1
            fi

            sleep 2
          done

      - name: Show Nomad job status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          nomad job status nginx-app

      - name: Verify allocation details
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  map(select(.ClientStatus == "running"))
                  | sort_by(.CreateTime)
                  | last
                  | .ID // empty
                '
          )"

          if [ -z "$ALLOC_ID" ]; then
            echo "ERROR: Running allocation not found."
            exit 1
          fi

          echo "Nomad Allocation ID: ${ALLOC_ID}"

          nomad alloc status "$ALLOC_ID"

          nomad alloc status -json "$ALLOC_ID" \
            | jq '{
                id: .ID,
                status: .ClientStatus,
                desired_status: .DesiredStatus
              }'

      - name: Verify Consul service registration
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if consul catalog service nginx-app >/dev/null 2>&1; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "nginx-app service was not registered in Consul."
              consul catalog services
              exit 1
            fi

            sleep 2
          done

          echo "Registered services:"
          consul catalog services

          echo
          echo "nginx-app service:"
          consul catalog service nginx-app

          echo
          echo "nginx-app health:"
          consul health service nginx-app

          HEALTH_STATUS="$(
            consul health service nginx-app -format=json \
              | jq -r '
                  [
                    .[]?.Checks[]?
                    | select(.CheckID | contains("nginx-health"))
                    | .Status
                  ]
                  | first // empty
                '
          )"

          echo "Consul health status: ${HEALTH_STATUS}"

          if [ "$HEALTH_STATUS" != "passing" ]; then
            echo "ERROR: nginx-app Consul health check is not passing."
            exit 1
          fi

      - name: Verify dynamic HTTP port
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  map(select(.ClientStatus == "running"))
                  | sort_by(.CreateTime)
                  | last
                  | .ID // empty
                '
          )"

          if [ -z "$ALLOC_ID" ]; then
            echo "ERROR: Running allocation not found."
            exit 1
          fi

          HOST_PORT="$(
            nomad alloc status -json "$ALLOC_ID" \
              | jq -r '
                  .AllocatedResources.Shared.Networks[0].DynamicPorts[]
                  | select(.Label == "http")
                  | .Value
                '
          )"

          if [ -z "$HOST_PORT" ] || [ "$HOST_PORT" = "null" ]; then
            echo "ERROR: Nomad dynamic HTTP port was not found."
            exit 1
          fi

          echo "Dynamic HTTP host port: ${HOST_PORT}"

          for i in $(seq 1 30); do
            if curl -fsS \
              "http://127.0.0.1:${HOST_PORT}/healthz" \
              >/dev/null; then
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Application health check failed."
              exit 1
            fi

            sleep 2
          done

          echo "Application health check through Nomad dynamic port:"

          curl -i \
            "http://127.0.0.1:${HOST_PORT}/healthz"

          chmod +x scripts/healthcheck.sh

          ./scripts/healthcheck.sh \
            "http://127.0.0.1:${HOST_PORT}/healthz"

      - name: Show agent logs on failure
        if: failure()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

          echo
          echo "===== DOCKER INFO ====="
          docker info || true

          echo
          echo "===== DOCKER SOCKET ====="
          ls -l /var/run/docker.sock || true
