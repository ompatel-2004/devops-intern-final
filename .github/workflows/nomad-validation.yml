name: Nomad Validation

on:
  push:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "nomad/**"
      - ".github/workflows/nomad-validation.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest

    env:
      NOMAD_VERSION: "1.7.7"
      CONSUL_VERSION: "1.17.2"
      IMAGE_TAG: "latest"
      IMAGE_NAME: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned HashiCorp tools
        run: |
          set -euo pipefail

          ARCH="amd64"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          sudo apt-get update
          sudo apt-get install -y unzip jq curl

          curl -fsSL \
            -o "$TMP_DIR/nomad.zip" \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/nomad"
          unzip -q "$TMP_DIR/nomad.zip" -d "$TMP_DIR/nomad"

          sudo install -m 0755 \
            "$TMP_DIR/nomad/nomad" \
            /usr/local/bin/nomad

          curl -fsSL \
            -o "$TMP_DIR/consul.zip" \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_${ARCH}.zip"

          mkdir -p "$TMP_DIR/consul"
          unzip -q "$TMP_DIR/consul.zip" -d "$TMP_DIR/consul"

          sudo install -m 0755 \
            "$TMP_DIR/consul/consul" \
            /usr/local/bin/consul

          nomad version
          consul version
          jq --version

      - name: Verify Docker daemon
        run: |
          set -euo pipefail

          sudo systemctl start docker
          sudo systemctl is-active --quiet docker

          test -S /var/run/docker.sock

          docker version
          docker info

      - name: Start Consul agent
        run: |
          set -euo pipefail

          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8500/v1/status/leader \
              | grep -q '"'; then
              echo "Consul is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Consul failed to start."
              cat /tmp/consul.log
              exit 1
            fi

            sleep 2
          done

          consul members

      - name: Start Nomad agent
        run: |
          set -euo pipefail

          sudo -E env DOCKER_HOST=unix:///var/run/docker.sock \
            nomad agent \
            -dev \
            -bind=0.0.0.0 \
            -network-interface=lo \
            > /tmp/nomad.log 2>&1 &

          for i in $(seq 1 30); do
            if nomad node status >/dev/null 2>&1; then
              echo "Nomad is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Nomad failed to start."
              cat /tmp/nomad.log
              exit 1
            fi

            sleep 2
          done

          nomad node status

      - name: Verify Nomad Docker driver
        run: |
          set -euo pipefail

          NODE_ID="$(
            nomad node status -self -json \
              | jq -r '.ID'
          )"

          if [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ]; then
            echo "Nomad node ID was not found."
            nomad node status
            exit 1
          fi

          echo "Nomad node ID: ${NODE_ID}"

          for i in $(seq 1 15); do
            DOCKER_DETECTED="$(
              nomad node status -self -json \
                | jq -r '.Drivers.docker.Detected // false'
            )"

            DOCKER_HEALTHY="$(
              nomad node status -self -json \
                | jq -r '.Drivers.docker.Healthy // false'
            )"

            if [ "$DOCKER_DETECTED" = "true" ] \
              && [ "$DOCKER_HEALTHY" = "true" ]; then
              echo "Docker driver is detected and healthy."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "ERROR: Docker driver was not detected as healthy."
              nomad node status -self
              exit 1
            fi

            echo "Waiting for Docker driver detection ($i/15)..."
            sleep 2
          done

      - name: Validate Nomad job
        run: |
          set -euo pipefail

          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Plan Nomad job
        run: |
          set -uo pipefail

          PLAN_FILE="$(mktemp)"
          PLAN_EXIT_CODE=0

          nomad job plan \
            -no-color \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl \
            > "$PLAN_FILE" 2>&1 || PLAN_EXIT_CODE=$?

          cat "$PLAN_FILE"

          if [ "$PLAN_EXIT_CODE" -eq 0 ] \
            || [ "$PLAN_EXIT_CODE" -eq 1 ]; then
            echo "Nomad plan executed successfully."
          else
            echo "ERROR: Nomad plan failed with unexpected exit code: ${PLAN_EXIT_CODE}."
            exit 1
          fi

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Pull application image
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Run Nomad job
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          nomad job run -detach \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

      - name: Wait for healthy allocation
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          echo "Waiting for task allocation to become healthy..."

          for i in $(seq 1 40); do
            HEALTHY="$(
              nomad job status nginx-app \
                | awk '$1 == "nginx" && $3 == "1" && $4 == "1" && $5 == "1" {print $5}'
            )"

            if [ "$HEALTHY" = "1" ]; then
              echo "Allocation is Healthy!"
              break
            fi

            if [ "$i" -eq 40 ]; then
              echo "ERROR: Allocation did not become healthy."
              nomad job status nginx-app
              exit 1
            fi

            echo "Waiting for healthy allocation ($i/40)..."
            sleep 3
          done

          nomad job status nginx-app

      - name: Verify allocation details
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  map(select(.ClientStatus == "running"))
                  | last
                  | .ID // empty
              '
          )"

          if [ -z "$ALLOC_ID" ]; then
            ALLOC_ID="$(
              nomad job allocs -json nginx-app \
                | jq -r '.[0].ID'
            )"
          fi

          if [ -z "$ALLOC_ID" ] || [ "$ALLOC_ID" = "null" ]; then
            echo "ERROR: Nomad allocation ID was not found."
            nomad job status nginx-app
            exit 1
          fi

          echo "Nomad Allocation ID: ${ALLOC_ID}"

          nomad alloc status "$ALLOC_ID"

      - name: Verify Consul service registration
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if consul catalog services \
              | grep -q "^nginx-app$"; then
              echo "Consul service registered."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "ERROR: nginx-app was not registered in Consul."
              consul catalog services
              exit 1
            fi

            sleep 2
          done

          echo "Catalog services:"
          consul catalog services

          echo
          echo "Checking service health via Consul API:"

          curl -fsS \
            http://127.0.0.1:8500/v1/health/service/nginx-app \
            | jq .

      - name: Verify dynamic HTTP port and application health
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          ALLOC_ID="$(
            nomad job allocs -json nginx-app \
              | jq -r '
                  map(select(.ClientStatus == "running"))
                  | last
                  | .ID // empty
              '
          )"

          if [ -z "$ALLOC_ID" ]; then
            ALLOC_ID="$(
              nomad job allocs -json nginx-app \
                | jq -r '.[0].ID'
            )"
          fi

          HOST_PORT="$(
            nomad alloc status -json "$ALLOC_ID" \
              | jq -r '
                  .AllocatedResources.Shared.Networks[0]
                  .DynamicPorts[]
                  | select(.Label == "http")
                  | .Value
              '
          )"

          if [ -z "$HOST_PORT" ] || [ "$HOST_PORT" = "null" ]; then
            echo "ERROR: Dynamic HTTP port not found."
            exit 1
          fi

          echo "Dynamically mapped host port: ${HOST_PORT}"

          timeout 30s sh -c \
            "until curl -s -f http://127.0.0.1:${HOST_PORT}/healthz; do sleep 2; done"

          echo
          echo "HTTP health response:"

          curl -i \
            "http://127.0.0.1:${HOST_PORT}/healthz"

          echo
          echo "Application healthcheck script:"

          chmod +x scripts/healthcheck.sh

          ./scripts/healthcheck.sh \
            "http://127.0.0.1:${HOST_PORT}/healthz"

      - name: Show agent logs on failure
        if: failure()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

          echo
          echo "===== NOMAD JOB STATUS ====="
          nomad job status nginx-app || true

          echo
          echo "===== DOCKER INFO ====="
          docker info || true

          echo
          echo "===== DOCKER IMAGES ====="
          docker images || true
