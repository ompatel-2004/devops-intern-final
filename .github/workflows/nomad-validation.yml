name: Validate and Deploy Nomad Job

on:
  push:
    branches: [ main ]
    paths:
      - 'nomad/**'
      - '.github/workflows/nomad-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'nomad/**'
      - '.github/workflows/nomad-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install HashiCorp Nomad & Consul
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y nomad consul jq

      - name: Start Consul Agent (Dev Mode)
        run: |
          consul agent -dev -client=0.0.0.0 &
          sleep 4
          consul members

      - name: Start Nomad Agent (Dev Mode)
        run: |
          sudo nomad agent -dev -bind=0.0.0.0 -network-interface=lo &
          sleep 6
          nomad node status

      - name: Pull Container Image from GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/ompatel-2004/devops-intern-final:latest

      - name: Validate Nomad Job File
        run: |
          nomad job validate -var="image_tag=latest" nomad/nginx-app.nomad.hcl

      - name: Plan and Run Nomad Job
        run: |
          nomad job plan -var="image_tag=latest" nomad/nginx-app.nomad.hcl || true
          nomad job run -var="image_tag=latest" nomad/nginx-app.nomad.hcl

      - name: Wait for Allocation to be Running
        run: |
          echo "Waiting for task allocation..."
          for i in {1..30}; do
            STATUS=$(nomad job status nginx-app | awk '/running/ {print $1}' | head -n 1)
            if [ -n "$STATUS" ]; then
              echo "Allocation is running!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 2
          done
          nomad job status nginx-app

      - name: Verify Allocation Details via JSON
        run: |
          ALLOC_ID=$(nomad job allocs -json nginx-app | jq -r '.[0].ID')
          echo "Nomad Allocation ID: $ALLOC_ID"
          nomad alloc status "$ALLOC_ID"

      - name: Verify Service in Consul
        run: |
          sleep 5
          echo "Listing registered services in Consul catalog:"
          curl -s http://127.0.0.1:8500/v1/catalog/services | jq .
          echo "Checking service health via Consul API:"
          curl -s http://127.0.0.1:8500/v1/health/service/nginx-app | jq .

      - name: Query Application Health via Dynamic Port
        run: |
          ALLOC_ID=$(nomad job allocs -json nginx-app | jq -r '.[0].ID')
          HOST_PORT=$(nomad alloc status -json "$ALLOC_ID" | jq -r '.AllocatedResources.Shared.Networks[0].DynamicPorts[] | select(.Label=="http") | .Value')
          echo "Dynamically mapped host port: $HOST_PORT"
          timeout 30s sh -c "until curl -s -f http://127.0.0.1:${HOST_PORT}/healthz; do sleep 2; done"
          curl -i "http://127.0.0.1:${HOST_PORT}/healthz"
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh "http://127.0.0.1:${HOST_PORT}/healthz"
