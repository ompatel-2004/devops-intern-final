name: Validate and Deploy Nomad Job

on:
  push:
    branches: [ main ]
    paths:
      - 'nomad/**'
      - '.github/workflows/nomad-validation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'nomad/**'
      - '.github/workflows/nomad-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nomad and Consul
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y nomad consul

      - name: Start Consul Agent (Dev Mode)
        run: |
          consul agent -dev -client=127.0.0.1 &
          sleep 5

      - name: Start Nomad Agent (Dev Mode)
        run: |
          sudo nomad agent -dev -bind=0.0.0.0 -network-interface=lo &
          sleep 8

      - name: Verify Nomad Node
        run: |
          nomad node status

      - name: Verify Consul
        run: |
          consul members

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Published Image
        run: |
          docker pull ghcr.io/ompatel-2004/devops-intern-final:latest

      - name: Validate Nomad Job
        run: |
          nomad job validate -var="image_tag=latest" nomad/nginx-app.nomad.hcl

      - name: Plan Nomad Deployment
        run: |
          nomad job plan -var="image_tag=latest" nomad/nginx-app.nomad.hcl || true

      - name: Deploy Nomad Job
        run: |
          nomad job run -var="image_tag=latest" nomad/nginx-app.nomad.hcl

      - name: Verify Nomad Deployment
        run: |
          sleep 10
          nomad job status nginx-app

      - name: Verify Allocation Health
        run: |
          ALLOC_ID=$(nomad job status nginx-app | awk '/Allocations/ {flag=1; next} flag && NF {print $1; exit}')
          echo "Checking allocation: $ALLOC_ID"
          nomad alloc status "$ALLOC_ID"
