name: Nomad Validation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  nomad:
    name: Validate and Deploy Nomad Job

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Image Tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Using image tag: ${HEAD_SHA}"
          echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Install Consul
        env:
          CONSUL_VERSION: "1.20.3"
        run: |
          curl -fsSLo /tmp/consul.zip \
            "https://releases.hashicorp.com/consul/${CONSUL_VERSION}/consul_${CONSUL_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/consul-bin

          unzip -o /tmp/consul.zip \
            -d /tmp/consul-bin

          sudo install \
            /tmp/consul-bin/consul \
            /usr/local/bin/consul

          consul version

      - name: Install Nomad
        env:
          NOMAD_VERSION: "1.9.7"
        run: |
          curl -fsSLo /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"

          mkdir -p /tmp/nomad-bin

          unzip -o /tmp/nomad.zip \
            -d /tmp/nomad-bin

          sudo install \
            /tmp/nomad-bin/nomad \
            /usr/local/bin/nomad

          nomad version

      - name: Start Consul
        run: |
          consul agent \
            -dev \
            -client=0.0.0.0 \
            > /tmp/consul.log 2>&1 &

          sleep 5

          echo "===== CONSUL MEMBERS ====="
          consul members

      - name: Start Nomad
        run: |
          nomad agent \
            -dev \
            > /tmp/nomad.log 2>&1 &

          sleep 10

          echo "===== NOMAD NODES ====="
          nomad node status

      - name: Validate Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== VALIDATING NOMAD JOB ====="

          nomad job validate \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          echo "Nomad job validation passed."

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Verify Published Image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== VERIFYING GHCR IMAGE ====="
          echo "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          docker pull \
            "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          echo "GHCR image pull succeeded."

      - name: Plan Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== NOMAD PLAN ====="

          set +e

          nomad job plan \
            -var="image_tag=${IMAGE_TAG}" \
            -no-color \
            nomad/nginx-app.nomad.hcl \
            2>&1 | tee /tmp/nomad-plan.txt

          PLAN_EXIT=${PIPESTATUS[0]}

          set -e

          echo "Nomad plan exit code: ${PLAN_EXIT}"

          if [ "${PLAN_EXIT}" -eq 0 ]; then
            echo "Nomad plan completed successfully with no allocation changes."
            exit 0
          fi

          if [ "${PLAN_EXIT}" -eq 1 ]; then
            echo "Nomad plan completed successfully and reports allocation changes."
            echo "Exit code 1 is expected when allocations will be created or destroyed."
            exit 0
          fi

          echo "ERROR: Nomad plan failed."
          exit "${PLAN_EXIT}"

      - name: Run Nomad Job
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "===== DEPLOYING NOMAD JOB ====="

          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            nomad/nginx-app.nomad.hcl

          echo "Nomad job submitted successfully."

      - name: Wait for Healthy Allocation
        shell: bash
        run: |
          set -euo pipefail

          echo "===== WAITING FOR HEALTHY ALLOCATION ====="

          ALLOC_ID=""

          for i in {1..30}; do
            echo ""
            echo "===== Attempt ${i}/30 ====="

            echo "Looking for running allocation..."

            ALLOC_ID=$(
              nomad job allocs -json nginx-app 2>/dev/null |
              jq -r '
                [
                  .[]
                  | select(.ClientStatus == "running")
                  | .ID
                ]
                | .[0] // empty
              '
            )

            if [ -z "${ALLOC_ID}" ]; then
              echo "No running allocation yet."
              sleep 5
              continue
            fi

            echo "Running allocation: ${ALLOC_ID}"

            echo ""
            echo "===== ALLOCATION STATUS ====="

            ALLOC_STATUS=$(nomad alloc status -short "${ALLOC_ID}")

            echo "${ALLOC_STATUS}"

            DEPLOYMENT_HEALTH=$(
              echo "${ALLOC_STATUS}" |
              awk -F'=' '
                /Deployment Health/ {
                  gsub(/^[ \t]+|[ \t]+$/, "", $2)
                  print $2
                  exit
                }
              '
            )

            echo ""
            echo "Deployment health: ${DEPLOYMENT_HEALTH:-unknown}"

            if [ "${DEPLOYMENT_HEALTH}" != "healthy" ]; then
              echo "Allocation is running but deployment health is not healthy yet."
              sleep 5
              continue
            fi

            echo ""
            echo "===== NOMAD SERVICE CHECKS ====="

            CHECKS_JSON=$(nomad alloc checks -json "${ALLOC_ID}")

            echo "${CHECKS_JSON}" | jq .

            ALIVE_CHECK_STATUS=$(
              echo "${CHECKS_JSON}" |
              jq -r '
                [
                  .[]
                  | select(.Check == "alive")
                  | .Status
                ]
                | .[0] // empty
              '
            )

            echo ""
            echo "alive check status: ${ALIVE_CHECK_STATUS:-missing}"

            if [ "${ALIVE_CHECK_STATUS}" != "success" ]; then
              echo "The Nomad 'alive' HTTP health check is not passing yet."
              sleep 5
              continue
            fi

            ALIVE_STATUS_CODE=$(
              echo "${CHECKS_JSON}" |
              jq -r '
                [
                  .[]
                  | select(.Check == "alive")
                  | .StatusCode
                ]
                | .[0] // empty
              '
            )

            echo "alive check HTTP status code: ${ALIVE_STATUS_CODE:-unknown}"

            if [ "${ALIVE_STATUS_CODE}" != "200" ]; then
              echo "ERROR: The alive health check is not returning HTTP 200."
              sleep 5
              continue
            fi

            echo ""
            echo "=========================================="
            echo "SUCCESS: NOMAD ALLOCATION IS HEALTHY"
            echo "=========================================="
            echo "Allocation: ${ALLOC_ID}"
            echo "Deployment Health: healthy"
            echo "Service Check: alive"
            echo "HTTP Status: 200"
            echo "=========================================="

            exit 0
          done

          echo ""
          echo "=========================================="
          echo "ERROR: NOMAD ALLOCATION DID NOT BECOME HEALTHY"
          echo "=========================================="

          if [ -n "${ALLOC_ID}" ]; then
            echo ""
            echo "===== FINAL ALLOCATION STATUS ====="
            nomad alloc status "${ALLOC_ID}" || true

            echo ""
            echo "===== FINAL SERVICE CHECKS ====="
            nomad alloc checks "${ALLOC_ID}" || true
          fi

          echo ""
          echo "===== FINAL NOMAD JOB STATUS ====="
          nomad job status nginx-app || true

          echo ""
          echo "===== FINAL NOMAD ALLOCATIONS ====="
          nomad job allocs nginx-app || true

          exit 1

      - name: Check Consul Service
        run: |
          echo "===== CONSUL SERVICE HEALTH ====="

          consul health service nginx-app

          echo "Consul service health check passed."

      - name: Verify Nomad Job Status
        run: |
          echo "===== FINAL NOMAD JOB STATUS ====="

          nomad job status nginx-app

      - name: Verify Nomad Node Status
        run: |
          echo "===== FINAL NOMAD NODE STATUS ====="

          nomad node status

      - name: Show Agent Logs
        if: always()
        run: |
          echo "===== CONSUL LOG ====="
          cat /tmp/consul.log || true

          echo ""
          echo "===== NOMAD LOG ====="
          cat /tmp/nomad.log || true

      - name: Show Final Nomad Allocation Status
        if: always()
        run: |
          echo "===== NOMAD ALLOCATIONS ====="

          nomad job allocs nginx-app || true
