name: Observability Validation

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  observability:
    name: Validate Loki Log Ingestion
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Determine Image Tag
        id: image
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Using image tag: ${HEAD_SHA}"
          echo "tag=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull Published Application Image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "Pulling:"
          echo "ghcr.io/${{ github.repository }}:${IMAGE_TAG}"

          docker pull \
            ghcr.io/${{ github.repository }}:${IMAGE_TAG}

      - name: Start NGINX Application
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker run -d \
            --name nginx-app \
            -p 8080:8080 \
            ghcr.io/${{ github.repository }}:${IMAGE_TAG}

      - name: Verify NGINX Health
        run: |
          timeout 30s sh -c \
            'until curl -s -f http://localhost:8080/healthz; do sleep 2; done'

          echo "NGINX health endpoint returned HTTP 200."

      - name: Start Monitoring Stack
        working-directory: monitoring
        run: |
          docker compose up -d

      - name: Show Monitoring Containers
        working-directory: monitoring
        run: |
          docker compose ps

      - name: Generate NGINX 404 Access Log
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            http://localhost:8080/assessment-missing-path)

          echo "Generated HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "404" ]; then
            echo "ERROR: Expected HTTP 404."
            exit 1
          fi

      - name: Wait for Loki Log Ingestion
        run: |
          for i in {1..30}; do
            echo "===== Loki query attempt ${i}/30 ====="

            RESPONSE=$(curl -sG \
              --data-urlencode 'query={container="nginx-app"} |= "404"' \
              http://localhost:3100/loki/api/v1/query)

            echo "${RESPONSE}"

            if echo "${RESPONSE}" | grep -q '"result"' && \
               echo "${RESPONSE}" | grep -q '404'; then
              echo "NGINX 404 access log successfully ingested into Loki."
              exit 0
            fi

            sleep 5
          done

          echo "ERROR: NGINX 404 log was not found in Loki."
          exit 1

      - name: Verify Loki Labels
        run: |
          echo "Available Loki labels:"
          curl -fsS \
            http://localhost:3100/loki/api/v1/labels

      - name: Verify NGINX Container Logs
        run: |
          echo "===== NGINX CONTAINER LOGS ====="
          docker logs nginx-app

      - name: Show Promtail Logs
        if: always()
        run: |
          echo "===== PROMTAIL LOGS ====="
          docker logs promtail || true

      - name: Show Loki Logs
        if: always()
        run: |
          echo "===== LOKI LOGS ====="
          docker logs loki || true

      - name: Clean Up
        if: always()
        working-directory: monitoring
        run: |
          docker compose down
          docker rm -f nginx-app || true
