name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts & Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck scripts/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag "nginx-app:${{ github.sha }}" \
            ./app

      - name: Check Image Size
        run: |
          IMAGE_SIZE=$(docker image inspect \
            "nginx-app:${{ github.sha }}" \
            --format '{{.Size}}')

          MAX_SIZE=$((60 * 1024 * 1024))

          echo "Image size: ${IMAGE_SIZE} bytes"
          echo "Maximum allowed: ${MAX_SIZE} bytes"

          if [ "${IMAGE_SIZE}" -ge "${MAX_SIZE}" ]; then
            echo "ERROR: Docker image is 60 MB or larger."
            exit 1
          fi

          echo "Image size requirement passed."

  test:
    name: Test Container & Health Endpoint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Test Image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag "nginx-app:${{ github.sha }}" \
            ./app

      - name: Start NGINX Container
        run: |
          docker run -d \
            --name nginx-app-test \
            -p 8080:8080 \
            "nginx-app:${{ github.sha }}"

      - name: Wait for NGINX Readiness
        run: |
          timeout 30s sh -c \
            'until curl -s -f http://localhost:8080/healthz; do sleep 2; done'

          echo "NGINX is ready."

      - name: Test Homepage
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            http://localhost:8080/)

          echo "Homepage HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Homepage did not return HTTP 200."
            exit 1
          fi

      - name: Test Health Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null \
            -w "%{http_code}" \
            http://localhost:8080/healthz)

          echo "Health endpoint HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: /healthz did not return HTTP 200."
            exit 1
          fi

      - name: Run Healthcheck Script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify Build SHA
        run: |
          RESPONSE=$(curl -s http://localhost:8080/)

          echo "${RESPONSE}"

          if ! echo "${RESPONSE}" | grep -q "${{ github.sha }}"; then
            echo "ERROR: BUILD_SHA was not injected into the application."
            exit 1
          fi

          echo "BUILD_SHA verification passed."

      - name: Show Container Logs
        if: always()
        run: |
          docker logs nginx-app-test || true

      - name: Clean Up Test Container
        if: always()
        run: |
          docker rm -f nginx-app-test || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Application Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

      - name: Verify Published Image Tags
        run: |
          echo "Published images:"
          echo "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "ghcr.io/${{ github.repository }}:latest"
