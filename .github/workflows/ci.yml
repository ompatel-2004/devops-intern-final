name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts & Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shellcheck scripts/*.sh

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          build-args: |
            BUILD_SHA=${{ github.sha }}
          load: true
          tags: nginx-app:${{ github.sha }}

      - name: Verify Image Size
        run: |
          IMAGE_SIZE=$(docker image inspect nginx-app:${{ github.sha }} --format '{{.Size}}')
          MAX_SIZE=$((60 * 1024 * 1024))

          echo "Image size: ${IMAGE_SIZE} bytes"
          echo "Maximum allowed: ${MAX_SIZE} bytes"

          if [ "${IMAGE_SIZE}" -ge "${MAX_SIZE}" ]; then
            echo "ERROR: Image exceeds the 60 MB limit."
            exit 1
          fi

          echo "Image size requirement passed."

  test:
    name: Test Container & Health Endpoint
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Test Image
        run: |
          docker build \
            --build-arg BUILD_SHA=${{ github.sha }} \
            -t nginx-app:${{ github.sha }} \
            app/

      - name: Run Container
        run: |
          docker run -d \
            --name test-app \
            -p 8080:8080 \
            nginx-app:${{ github.sha }}

      - name: Wait for Container Readiness
        run: |
          timeout 30s sh -c \
            'until curl -s -f http://localhost:8080/healthz; do sleep 2; done'

      - name: Verify Homepage
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/)
          echo "Homepage HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: Homepage did not return HTTP 200."
            exit 1
          fi

      - name: Verify Health Endpoint
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz)
          echo "Health endpoint HTTP status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "ERROR: /healthz did not return HTTP 200."
            exit 1
          fi

      - name: Execute Healthcheck Script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Show Container Information
        if: always()
        run: |
          docker ps -a
          docker logs test-app || true

      - name: Clean Up Test Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, test]

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}