name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Scripts & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        run: |
          shellcheck scripts/*.sh

- name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          build-args: |
            BUILD_SHA=${{ github.sha }}
          load: true
          tags: nginx-app:${{ github.sha }}

  test:
    name: Test Endpoint Readiness
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Run Container
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t nginx-app:${{ github.sha }} app/
          docker run -d --name test-app -p 8080:8080 nginx-app:${{ github.sha }}

      - name: Wait for Container Readiness
        run: |
          timeout 30s sh -c 'until curl -s -f http://localhost:8080/healthz; do sleep 2; done'

      - name: Execute Healthcheck Script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Clean up Test Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app || true

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
