name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${{ github.sha }}" \
            --tag "nginx-app:${{ github.sha }}" \
            ./app

      - name: Verify image size and non-root user
        run: |
          SIZE_BYTES="$(docker image inspect "nginx-app:${{ github.sha }}" \
            --format='{{.Size}}')"

          USER_NAME="$(docker image inspect "nginx-app:${{ github.sha }}" \
            --format='{{.Config.User}}')"

          echo "Image size: ${SIZE_BYTES} bytes"
          echo "Configured user: ${USER_NAME}"

          if [ "${SIZE_BYTES}" -ge 60000000 ]; then
            echo "ERROR: Docker image is 60 MB or larger."
            exit 1
          fi

          if [ -z "${USER_NAME}" ] || [ "${USER_NAME}" = "0" ] || [ "${USER_NAME}" = "root" ]; then
            echo "ERROR: Container is configured to run as root."
            exit 1
          fi

          echo "Image is below 60 MB and configured for a non-root user."

      - name: Save built image
        run: |
          docker save "nginx-app:${{ github.sha }}" \
            | gzip > nginx-app.tar.gz

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx-app.tar.gz
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: |
          gunzip -c nginx-app.tar.gz | docker load

      - name: Start application
        run: |
          docker run -d \
            --name nginx-app \
            -p 8080:8080 \
            "nginx-app:${{ github.sha }}"

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application... (${i}/30)"
            sleep 2
          done

          echo "ERROR: Application did not become ready."
          docker logs nginx-app
          exit 1

      - name: Test homepage
        run: |
          curl -fsS http://localhost:8080/ > /tmp/homepage.html
          grep -q "DevOps Intern Final Assessment" /tmp/homepage.html
          grep -q "${{ github.sha }}" /tmp/homepage.html

      - name: Test health endpoint
        run: |
          curl -fsS http://localhost:8080/healthz

      - name: Run healthcheck script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080/healthz

      - name: Verify non-root user
        run: |
          USER_ID="$(docker exec nginx-app id -u)"
          USER_NAME="$(docker exec nginx-app id -un)"

          echo "Container UID: ${USER_ID}"
          echo "Container user: ${USER_NAME}"

          if [ "${USER_ID}" = "0" ]; then
            echo "ERROR: NGINX is running as root."
            exit 1
          fi

          echo "NGINX is running as a non-root user."

      - name: Verify build SHA response header
        run: |
          curl -fsSI http://localhost:8080/ \
            | grep -i "^X-Build-SHA:"

          curl -fsSI http://localhost:8080/ \
            | grep -i "${{ github.sha }}"

      - name: Show container logs
        if: always()
        run: |
          docker logs nginx-app

      - name: Stop container
        if: always()
        run: |
          docker rm -f nginx-app || true

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: |
          gunzip -c nginx-app.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag \
            "nginx-app:${{ github.sha }}" \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}"

          docker tag \
            "nginx-app:${{ github.sha }}" \
            "ghcr.io/${{ github.repository }}:latest"

      - name: Push immutable SHA image
        run: |
          docker push \
            "ghcr.io/${{ github.repository }}:${{ github.sha }}"

      - name: Push latest image
        run: |
          docker push \
            "ghcr.io/${{ github.repository }}:latest"
