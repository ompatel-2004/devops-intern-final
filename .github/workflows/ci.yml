name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./scripts"

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --tag nginx-app:"${GITHUB_SHA}" \
            ./app

      - name: Show image details
        run: |
          docker image inspect nginx-app:"${GITHUB_SHA}" \
            --format='Image size: {{.Size}} bytes'

          docker image inspect nginx-app:"${GITHUB_SHA}" \
            --format='User: {{.Config.User}}'

      - name: Save image
        run: |
          docker save nginx-app:"${GITHUB_SHA}" \
            | gzip > nginx-app.tar.gz

      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: nginx-image
          path: nginx-app.tar.gz
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: |
          gunzip -c nginx-app.tar.gz | docker load

      - name: Start application
        run: |
          docker run -d \
            --name nginx-app \
            -p 8080:8080 \
            nginx-app:"${GITHUB_SHA}"

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "Application is ready."
              exit 0
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application did not become ready."
          docker logs nginx-app
          exit 1

      - name: Test homepage
        run: |
          curl -fsS http://localhost:8080/ > /tmp/homepage.html
          grep -q "DevOps Intern Final Assessment" /tmp/homepage.html

      - name: Test health endpoint
        run: |
          curl -fsS http://localhost:8080/healthz

      - name: Run healthcheck script
        run: |
          chmod +x scripts/healthcheck.sh
          ./scripts/healthcheck.sh http://localhost:8080

      - name: Verify non-root user
        run: |
          USER_ID="$(docker exec nginx-app id -u)"
          echo "Container UID: ${USER_ID}"

          if [ "${USER_ID}" = "0" ]; then
            echo "NGINX is running as root."
            exit 1
          fi

          echo "NGINX is running as a non-root user."

      - name: Verify build SHA
        run: |
          curl -fsSI http://localhost:8080/ | grep -i "^X-Build-SHA:"
          curl -fsS http://localhost:8080/ | grep -q "${GITHUB_SHA}"

      - name: Show container logs
        if: always()
        run: docker logs nginx-app

      - name: Stop container
        if: always()
        run: docker rm -f nginx-app || true

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: nginx-image

      - name: Load Docker image
        run: |
          gunzip -c nginx-app.tar.gz | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image
        run: |
          docker tag \
            nginx-app:"${GITHUB_SHA}" \
            ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}

          docker tag \
            nginx-app:"${GITHUB_SHA}" \
            ghcr.io/${GITHUB_REPOSITORY}:latest

      - name: Push images
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}
          docker push ghcr.io/${GITHUB_REPOSITORY}:latest
