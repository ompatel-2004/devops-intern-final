<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Intern Final</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2933;
        }

        .card {
            width: 100%;
            max-width: 720px;
            padding: 40px;
            background: #ffffff;
            border: 1px solid #d9dee3;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        p {
            line-height: 1.6;
            color: #52606d;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 12px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #256029;
            font-size: 14px;
            font-weight: 600;
        }

        .details {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e4e7eb;
        }

        .details p {
            margin: 8px 0;
        }

        code {
            padding: 2px 6px;
            border-radius: 4px;
            background: #f0f2f4;
            font-family: Consolas, Monaco, monospace;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>DevOps Intern Final Assessment</h1>

        <p>
            A small NGINX application used to demonstrate containerisation,
            continuous integration, deployment with Nomad, and centralized
            logging with Loki.
        </p>

        <span class="status">Application is running</span>

        <section class="details">
            <p><strong>Application:</strong> NGINX</p>
            <p><strong>Port:</strong> <code>8080</code></p>
            <p><strong>Health check:</strong> <code>/healthz</code></p>
            <p><strong>Build:</strong> <code>__BUILD_SHA__</code></p>
        </section>
    </main>
</body>
</html>
